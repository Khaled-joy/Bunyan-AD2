openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: studio
    description: Bunyan Studio project operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /studio/projects:
    get:
      operationId: listStudioProjects
      tags: [studio]
      summary: List Bunyan Studio projects
      responses:
        "200":
          description: Saved projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudioProject"
    post:
      operationId: createStudioProject
      tags: [studio]
      summary: Create a Bunyan Studio project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioProject"
  /studio/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getStudioProject
      tags: [studio]
      summary: Load one Bunyan Studio project
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioProject"
        "404":
          description: Project not found
    put:
      operationId: updateStudioProject
      tags: [studio]
      summary: Update and autosave a Bunyan Studio project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioProjectInput"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioProject"
        "404":
          description: Project not found
    delete:
      operationId: deleteStudioProject
      tags: [studio]
      summary: Delete a Bunyan Studio project
      responses:
        "204":
          description: Project deleted
        "404":
          description: Project not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudioProject:
      type: object
      required: [id, name, theme, locale, config, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        theme:
          type: string
        locale:
          type: string
          enum: [en, ar]
        config:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StudioProjectInput:
      type: object
      required: [name, theme, locale, config]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        theme:
          type: string
          minLength: 1
          maxLength: 80
        locale:
          type: string
          enum: [en, ar]
        config:
          type: object
          additionalProperties: true

