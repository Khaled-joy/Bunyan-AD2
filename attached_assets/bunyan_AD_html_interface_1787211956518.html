<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بنيان أبوظبي — ابدأ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#CFE9F7;
    --sky-2:#E8F4FA;
    --sand:#FCF1DA;
    --card:#FFFFFF;
    --field:#F5F9FC;
    --line:#D6E2E9;
    --line-2:#BDD0DA;
    --ink:#1A2830;
    --muted:#5F737C;
    --red:#D8232A;
    --yellow:#F4B60B;
    --teal:#16A7BC;
    --teal-d:#0B6A79;
    --blue:#2140A8;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}

  body{
    font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(176deg,var(--sky) 0%,var(--sky-2) 42%,var(--sand) 100%);
    min-height:100vh;
    display:flex;flex-direction:column;
    overflow-x:hidden;position:relative;
  }
  html[dir="rtl"] body{font-family:'Cairo','IBM Plex Sans Arabic',sans-serif}

  .glow{
    position:absolute;top:1vh;right:8vw;
    width:min(400px,58vw);aspect-ratio:1;
    background:radial-gradient(circle,rgba(244,182,11,.34) 0%,rgba(244,182,11,.12) 44%,transparent 70%);
    pointer-events:none;
  }

  .skyline{
    position:absolute;left:0;right:0;bottom:0;
    width:100%;height:auto;pointer-events:none;
    opacity:0;transform:translateY(16px);
    animation:rise 1s cubic-bezier(.22,.9,.28,1) .15s forwards;
  }
  @keyframes rise{to{opacity:1;transform:translateY(0)}}

  .stage{
    position:relative;z-index:2;flex:1;
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(16px,3vh,32px) 20px clamp(190px,25vh,290px);
    width:100%;max-width:540px;margin:0 auto;
  }

  /* ---------- language ---------- */

  .lang{
    align-self:flex-end;
    display:flex;gap:3px;
    background:rgba(255,255,255,.72);
    border:1px solid var(--line);
    border-radius:999px;padding:3px;
    margin-bottom:14px;
    backdrop-filter:blur(4px);
  }
  .lang button{
    font:inherit;font-size:13.5px;font-weight:600;
    padding:7px 15px;border:none;border-radius:999px;
    background:none;color:var(--muted);cursor:pointer;
    transition:background .15s,color .15s;
  }
  .lang button[aria-pressed="true"]{background:var(--teal);color:#fff}
  .lang button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

  .logo{
    width:min(400px,80vw);height:auto;display:block;
    margin-bottom:clamp(16px,3vh,28px);
    filter:drop-shadow(0 2px 3px rgba(26,40,48,.28));
    opacity:0;animation:rise .8s ease-out .05s forwards;
  }

  /* ---------- card ---------- */

  .card{
    width:100%;background:var(--card);
    border:1px solid var(--line);border-radius:22px;overflow:hidden;
    box-shadow:0 20px 48px rgba(26,40,48,.14),0 2px 6px rgba(26,40,48,.05);
    opacity:0;transform:translateY(18px);
    animation:rise .85s cubic-bezier(.22,.9,.28,1) .3s forwards;
  }

  .brick-strip{display:flex;height:9px}
  .brick-strip i{flex:1}
  .brick-strip i:nth-child(1){background:var(--red)}
  .brick-strip i:nth-child(2){background:var(--yellow)}
  .brick-strip i:nth-child(3){background:var(--teal)}
  .brick-strip i:nth-child(4){background:var(--blue)}

  .card-body{padding:clamp(24px,4.5vw,34px)}

  h1{font-family:'Cairo',sans-serif;font-size:clamp(24px,4.6vw,29px);font-weight:800;letter-spacing:-.015em}
  .sub{font-size:15px;color:var(--muted);margin-top:9px;margin-bottom:26px;line-height:1.6}

  label,.flabel{display:block;font-size:14px;font-weight:600;margin-bottom:9px}

  .field{margin-bottom:24px}

  input[type=text]{
    width:100%;font:inherit;font-size:17px;font-weight:500;
    padding:15px 16px;background:var(--field);
    border:2px solid var(--line);border-radius:13px;color:var(--ink);
    transition:border-color .16s,box-shadow .16s,background .16s;
  }
  input::placeholder{color:#93A6AE;font-weight:400}
  input:focus{outline:none;background:#fff;border-color:var(--teal);box-shadow:0 0 0 4px rgba(22,167,188,.18)}

  /* ---------- pill grids ---------- */

  .pills{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
  .pill{
    font:inherit;cursor:pointer;
    background:var(--field);border:2px solid var(--line);
    border-radius:11px;padding:12px 2px;
    color:var(--ink);font-size:16px;font-weight:700;text-align:center;
    transition:border-color .14s,background .14s,transform .12s;
  }
  .pill:hover{border-color:var(--line-2)}
  .pill:active{transform:translateY(2px)}
  .pill:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  #ages .pill[aria-pressed="true"]{border-color:var(--red);background:#FCEBEC}
  #grades .pill[aria-pressed="true"]{border-color:var(--teal);background:#E7F8FB}

  /* ---------- buttons ---------- */

  .btn{
    width:100%;font:inherit;font-family:'Cairo',sans-serif;
    font-size:18px;font-weight:800;
    padding:16px;border:none;border-radius:14px;cursor:pointer;margin-top:10px;
    background:var(--teal);color:#04252A;box-shadow:0 5px 0 var(--teal-d);
    transition:transform .12s,filter .16s,box-shadow .12s;
  }
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--teal-d)}
  .btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

  .btn-guest{
    width:100%;margin-top:10px;
    font:inherit;font-family:'Cairo',sans-serif;font-size:16px;font-weight:700;
    padding:14px;border-radius:13px;cursor:pointer;
    background:#fff;color:var(--teal-d);border:2px solid var(--teal);
    transition:background .15s,transform .1s;
  }
  .btn-guest:hover{background:#E7F8FB}
  .btn-guest:active{transform:translateY(2px)}
  .btn-guest:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

  .guest-note{
    font-size:12.5px;color:var(--muted);text-align:center;
    margin-top:9px;line-height:1.55;
  }

  .error{display:none;font-size:13.5px;color:#C62828;margin-top:8px}
  .error.show{display:block}

  /* ---------- footer actions ---------- */

  .actions{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}

    display:block;width:100%;background:none;border:none;cursor:pointer;
    font:inherit;font-size:14px;color:var(--muted);text-align:center;padding:4px;
  }

  .btn-admin{
    width:100%;margin-top:2px;
    font:inherit;font-size:15px;font-weight:600;
    padding:13px;border-radius:12px;cursor:pointer;
    background:#fff;color:var(--blue);
    border:2px solid var(--blue);
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:background .15s;
  }
  .btn-admin:hover{background:#EEF2FC}
  .btn-admin:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .btn-admin svg{width:17px;height:17px;flex:none}

    width:100%;font:inherit;font-size:15.5px;padding:13px 15px;margin-bottom:11px;
    background:var(--field);border:2px solid var(--line);border-radius:12px;color:var(--ink);
  }

  [hidden]{display:none !important}

  @media (max-width:400px){
    .pills{grid-template-columns:repeat(4,1fr);gap:6px}
    .pill{font-size:15px;padding:11px 2px}
  }

  @media (prefers-reduced-motion:reduce){
    .skyline,.card,.logo{animation:none;opacity:1;transform:none}
  }
</style>
</head>

    lang = next;

    document.querySelectorAll('[data-ph-en]').forEach(function(el){
      el.placeholder = el.getAttribute('data-ph-' + next);
    });
  }

  enBtn.addEventListener('click', function(){ setLang('en'); });
  arBtn.addEventListener('click', function(){ setLang('ar'); });

  /* ---------- selection ---------- */

  function fail(id, on){ document.getElementById(id).classList.toggle('show', on); }

  var picked = { age: null, grade: null };

  ['ages','grades'].forEach(function(groupId){
    var key = groupId === 'ages' ? 'age' : 'grade';
    var group = document.getElementById(groupId);
    group.querySelectorAll('.pill').forEach(function(btn){
      btn.addEventListener('click', function(){
        group.querySelectorAll('.pill').forEach(function(b){ b.setAttribute('aria-pressed','false'); });
        btn.setAttribute('aria-pressed','true');
        picked[key] = Number(btn.dataset.v);
        fail(key + '-error', false);
      });
    });
  });

  var nameEl = document.getElementById('name');
  var schoolEl = document.getElementById('school');
  nameEl.addEventListener('input', function(){ fail('name-error', false); });
  schoolEl.addEventListener('input', function(){ fail('school-error', false); });

  document.getElementById('enter').addEventListener('click', function(){
    var n = nameEl.value.trim();
    var s = schoolEl.value.trim();
    var bad = false;
    if(!n){ fail('name-error', true); bad = true; }
    if(!picked.age){ fail('age-error', true); bad = true; }
    if(!picked.grade){ fail('grade-error', true); bad = true; }
    if(!s){ fail('school-error', true); bad = true; }
    if(bad) return;
    console.log('enter', { name:n, age:picked.age, grade:picked.grade, school:s, lang:lang });
  });

  [nameEl, schoolEl].forEach(function(el){
    el.addEventListener('keydown', function(e){
      if(e.key === 'Enter') document.getElementById('enter').click();
    });
  });

  document.getElementById('guest').addEventListener('click', function(){
    fail('name-error', false);
    fail('grade-error', false);
    fail('school-error', false);
    if(!picked.age){ fail('age-error', true); document.getElementById('ages').scrollIntoView({block:'center'}); return; }
    console.log('enter as guest', { age:picked.age, grade:picked.grade || null, lang:lang });
  });

  document.getElementById('admin').addEventListener('click', function(){
    console.log('navigate: /admin');
  });

})();
</script>

</body>
</html>
